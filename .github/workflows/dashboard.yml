name: Dashboard
on:
  push:
    branches: ["feat/dashboard-apresentacao"]
    paths: ["dashboard/**", "tests/test_dashboard*.py", ".streamlit/**", ".github/workflows/dashboard.yml"]
  pull_request:
    paths: ["dashboard/**", "tests/test_dashboard*.py", ".streamlit/**", ".github/workflows/dashboard.yml"]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: dashboard/requirements.txt
      - run: python -m pip install -r dashboard/requirements.txt
      - run: python -m unittest discover -s tests -p 'test_dashboard*.py' -v
